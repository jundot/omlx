<!-- A Linux or Windows PC with an NVIDIA GPU, or a DGX Spark, as a Prefill
     Accelerator helper: the commands to run on it, ready to copy. -->
<div class="text-left" data-cluster-v2-cuda-guide>
    <button type="button" @click="cudaGuideOpen = !cudaGuideOpen" :aria-expanded="cudaGuideOpen"
            class="w-full flex items-center justify-between gap-2 text-xs font-semibold text-neutral-600 hover:text-neutral-900">
        <span class="inline-flex items-center gap-1.5">
            <i data-lucide="server" class="w-3.5 h-3.5"></i>
            {{ t('cluster.v2.cuda_guide.title') }}
        </span>
        <i data-lucide="chevron-down" class="w-3.5 h-3.5 transition-transform"
           :class="cudaGuideOpen ? 'rotate-180' : ''"></i>
    </button>
    <div x-show="cudaGuideOpen" x-cloak class="mt-2">
        <p class="text-xs text-neutral-500">{{ t('cluster.v2.cuda_guide.blurb') }}</p>
        <div class="mt-3 inline-flex rounded-full border border-neutral-200 p-0.5 bg-neutral-50">
            <template x-for="os in ['linux', 'windows', 'spark']" :key="os">
                <button type="button" @click="cudaGuideOs = os"
                        class="px-3 py-1 text-caption font-semibold rounded-full"
                        :class="cudaGuideOs === os ? 'bg-neutral-900 text-white' : 'text-neutral-600 hover:text-neutral-900'"
                        x-text="window.t('cluster.v2.cuda_guide.os_' + os)"></button>
            </template>
        </div>
        <ol class="mt-3 space-y-3">
            <template x-for="(step, index) in cudaGuideSteps()" :key="cudaGuideOs + index">
                <li>
                    <div class="flex items-start gap-2 text-xs text-neutral-700">
                        <span class="w-4 h-4 rounded-full bg-neutral-900 text-white text-caption font-bold flex items-center justify-center flex-shrink-0 mt-0.5"
                              x-text="index + 1"></span>
                        <span x-text="window.t(step.text)"></span>
                    </div>
                    <div x-show="step.command" class="mt-1.5 flex items-start gap-2 rounded-lg border border-neutral-200 bg-neutral-50 px-3 py-2">
                        <pre class="flex-1 text-left text-caption font-mono text-neutral-800 whitespace-pre-wrap break-all select-all" x-text="step.command"></pre>
                        <button type="button" @click="copyCudaGuide(step.command, cudaGuideOs + index)"
                                class="inline-flex items-center gap-1 px-2 py-1 text-caption font-medium text-neutral-600 border border-neutral-200 rounded-full hover:bg-neutral-100 flex-shrink-0">
                            <i data-lucide="copy" class="w-3 h-3"></i>
                            <span x-text="cudaGuideCopied === cudaGuideOs + index ? window.t('cluster.v2.common.copied') : window.t('cluster.v2.common.copy')"></span>
                        </button>
                    </div>
                </li>
            </template>
        </ol>
    </div>
</div>
