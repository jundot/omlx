                            </template>
                        </div>

                        <div x-show="clusterFabricError" x-cloak
                             class="mt-2 px-3 py-2 bg-red-50 border border-red-200 rounded-lg text-[10px] text-red-700"
                             x-text="clusterFabricError"></div>

                        <!-- The backend, stated rather than offered. Anything
                             but the TCP ring needs a full RDMA matrix, so when
                             one cannot be derived the fall back is said out
                             loud instead of dying inside a constructor. -->
                        <template x-if="clusterFabric && !clusterIpsOverridden">
                            <div class="mt-2 rounded-xl border px-3 py-2"
                                 :class="clusterFabric.fell_back
                                    ? 'border-amber-200 bg-amber-50'
                                    : 'border-neutral-200 bg-neutral-50'">
                                <div class="flex items-start gap-2">
                                    <i :data-lucide="clusterFabric.fell_back ? 'triangle-alert' : 'circle-check'"
                                       class="w-3.5 h-3.5 mt-0.5 flex-shrink-0"
                                       :class="clusterFabric.fell_back ? 'text-amber-600' : 'text-neutral-500'"></i>
                                    <p class="text-[10px] leading-relaxed"
                                       :class="clusterFabric.fell_back ? 'text-amber-800' : 'text-neutral-600'">
                                        <span class="font-mono font-semibold" x-text="clusterFabric.backend"></span>
                                        <span x-text="' — ' + clusterFabric.backend_reason"></span>
                                    </p>
                                </div>
                            </div>
                        </template>

                        <p class="mt-3 text-[11px] text-neutral-500">
                            First connection only: oMLX records a new peer address automatically and refuses changed host keys.
                            Password prompts are never shown by the GUI; configure an SSH key for unattended launches.
                        </p>
                        <div class="mt-3 flex justify-end"
                             x-show="clusterPeerProbe?.runtime_compatible">
                            <button type="button"
                                    @click="clusterShowPeerAdvanced = false"
                                    class="px-3 py-1.5 text-xs font-medium text-neutral-600 bg-white border border-neutral-200 rounded-lg hover:bg-neutral-50">
                                Hide connection details
                            </button>
                        </div>
                        </div>

                        <template x-if="clusterPeerProbe
                            && (!clusterPeerProbe.runtime_compatible || clusterShowPeerAdvanced)">
                            <div class="mt-5 rounded-2xl border p-4"
                                 :class="clusterPeerProbe.runtime_compatible
                                    ? 'border-green-200 bg-green-50'
                                    : 'border-red-200 bg-red-50'">
                                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                                    <div>
                                        <div class="flex items-center gap-2 text-sm font-semibold"
                                             :class="clusterPeerProbe.runtime_compatible ? 'text-green-700' : 'text-red-700'">
                                            <i x-show="clusterPeerProbe.runtime_compatible"
                                               data-lucide="circle-check"
                                               class="w-4 h-4"></i>
                                            <i x-show="!clusterPeerProbe.runtime_compatible"
                                               data-lucide="circle-x"
                                               class="w-4 h-4"></i>
                                            <span x-text="clusterPeerProbe.status.node.hostname + ' · ' + clusterPeerProbe.status.node.chip_name"></span>
                                        </div>
                                        <div class="text-xs mt-1"
                                             :class="clusterPeerProbe.runtime_compatible ? 'text-green-700' : 'text-red-700'"
                                             x-text="formatClusterGiB(clusterPeerProbe.status.node.recommended_working_set_bytes) +
                                                ' usable · MLX ' + clusterPeerProbe.status.runtime.mlx_version +
                                                ' · ' + (clusterPeerProbe.status.transport.rdma.devices.length || 0) + ' RDMA interface(s)'"></div>
                                    </div>
                                    <!-- A non-blocking runtime warning (e.g. a Python patch-level
                                         split, #2695) must not read as an unqualified match. -->
                                    <span class="text-xs font-medium"
                                          :class="!clusterPeerProbe.runtime_compatible ? 'text-red-700'
                                                  : ((clusterPeerProbe.runtime_warnings || []).length ? 'text-amber-700' : 'text-green-700')"
                                          x-text="!clusterPeerProbe.runtime_compatible
                                                  ? clusterPeerProbe.runtime_mismatches.join(' · ')
                                                  : ((clusterPeerProbe.runtime_warnings || []).length
                                                     ? clusterPeerProbe.runtime_warnings.join(' · ')
                                                     : 'Runtime match')"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Unequal-memory planner -->
                <div x-show="clusterShowSetupDetails" x-cloak
                     class="bg-white border border-neutral-200 rounded-2xl overflow-hidden mb-6"
                     data-cluster-planner>
                    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3 px-6 py-4 bg-neutral-100 border-b border-neutral-200">
                        <div>
                            <div class="flex items-center gap-2">
                                <i data-lucide="split-square-vertical" class="w-4 h-4 text-neutral-500"></i>
                                <span class="text-xs font-bold uppercase tracking-wider text-neutral-600">2 · Unequal-memory planner</span>
                            </div>
                            <p class="text-xs text-neutral-400 mt-1">Contiguous pipeline stages in MLX rank order</p>
                        </div>
                    </div>
                    <div class="p-6">
                        <!-- One-click start: the server picks and verifies the
                             transport, split and backend, then its exact
                             launch-ready payload is activated. Manual controls
                             below stay available and stay in sync. -->
                        <div class="mb-5 rounded-2xl border border-neutral-200 bg-neutral-50 p-4">
                            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                                <div class="min-w-0">
                                    <div class="text-sm font-semibold text-neutral-900">Start automatically</div>
                                    <div class="text-xs text-neutral-500 mt-1">
                                        Checks every worker, chooses the links and model split, then starts the cluster.
                                    </div>
                                </div>
                                <button @click="startCluster()"
                                        :disabled="clusterLinkSetupLoading || clusterAutoconfigureLoading || clusterActivationLoading"
                                        class="inline-flex items-center gap-2 px-4 py-2 text-xs font-medium text-white bg-neutral-900 rounded-lg hover:bg-neutral-800 disabled:opacity-50 whitespace-nowrap shrink-0">
                                    <i data-lucide="power" class="w-3.5 h-3.5"></i>
                                    <span x-text="clusterLinkSetupLoading
                                        ? (clusterActivationProgress || 'Configuring Thunderbolt…')
                                        : (clusterActivationLoading
                                            ? (clusterActivationProgress || 'Starting cluster…')
                                            : (clusterAutoconfigureLoading ? 'Checking every worker…' : 'Start Cluster'))"></span>
                                </button>
                            </div>

                            <div class="mt-3 flex items-center gap-2 rounded-xl border border-neutral-200 bg-white px-3 py-2">
                                <i data-lucide="network" class="w-3.5 h-3.5 text-green-600 shrink-0"></i>
                                <span class="text-[11px] text-neutral-600"
                                      x-text="clusterTopologySummary()"></span>
                            </div>

                            <!-- How to split the model. Framed by intent — make it
                                 faster, or make something bigger fit — because that
                                 is the decision the user is actually making. -->
                            <div class="mt-4 grid grid-cols-1 sm:grid-cols-3 gap-2">
                                <template x-for="opt in clusterStrategyOptions" :key="opt.key">
                                    <button @click="clusterStrategy = opt.key"
                                            type="button"
                                            class="text-left rounded-xl border p-3 transition-colors"
                                            :class="clusterStrategy === opt.key
                                                ? 'border-neutral-900 bg-white ring-1 ring-neutral-900'
                                                : 'border-neutral-200 bg-white hover:bg-neutral-100'">
                                        <div class="flex items-center gap-1.5">
                                            <span class="w-3.5 h-3.5 rounded-full border flex items-center justify-center shrink-0"
                                                  :class="clusterStrategy === opt.key ? 'border-neutral-900' : 'border-neutral-300'">
                                                <span x-show="clusterStrategy === opt.key"
                                                      class="w-1.5 h-1.5 rounded-full bg-neutral-900"></span>
                                            </span>
                                            <span class="text-xs font-semibold text-neutral-900" x-text="opt.label"></span>
                                        </div>
                                        <div class="text-[10px] text-neutral-600 mt-1 pl-5" x-text="opt.summary"></div>
                                        <div class="text-[10px] text-neutral-400 mt-1.5 pl-5 leading-relaxed" x-text="opt.detail"></div>
                                    </button>
                                </template>
                            </div>

                            <div x-show="clusterAutoconfigureError" x-cloak
                                 class="mt-3 px-3 py-2 bg-red-50 border border-red-200 rounded-lg text-xs text-red-700"
                                 x-text="clusterAutoconfigureError"></div>

                            <!-- Use the same downloaded-model catalogue as the
                                 rest of oMLX. A repository owner directory is
                                 not a model, and asking someone to type a cache
                                 path here made those folders look like broken
                                 zero-byte models. -->
                            <div class="mt-3 pt-3 border-t border-neutral-200">
                                <div class="flex items-center justify-between gap-3">
                                    <div>
                                        <div class="text-xs font-medium text-neutral-800">Choose a downloaded model</div>
                                        <div class="text-[10px] text-neutral-500 mt-0.5">
                                            The selected model will run across the accelerator pool above.
                                        </div>
                                    </div>
                                    <button @click="loadClusterCatalogue()"
                                            :disabled="clusterCatalogueLoading"
                                            class="px-3 py-1.5 text-xs font-medium text-neutral-700 bg-white border border-neutral-200 rounded-lg hover:bg-neutral-100 disabled:opacity-50">
                                        <i data-lucide="gauge" class="w-3.5 h-3.5"></i>
                                        <span x-text="clusterCatalogueLoading ? 'Checking fit…' : 'Check fit'"></span>
                                    </button>
                                </div>

                                <div class="relative mt-3">
                                    <i data-lucide="search"
                                       aria-hidden="true"
                                       class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-neutral-400"></i>
                                    <input type="search"
                                           x-model="clusterModelSearch"
                                           placeholder="Search models across the pool"
                                           class="w-full pl-9 pr-3 py-2 text-xs border border-neutral-200 rounded-xl focus:ring-2 focus:ring-neutral-900 focus:border-transparent">
                                </div>

                                <div x-show="clusterCatalogueError" x-cloak
                                     class="mt-2 px-3 py-2 bg-red-50 border border-red-200 rounded-lg text-xs text-red-700"
                                     x-text="clusterCatalogueError"></div>

                                <div class="mt-2 max-h-64 overflow-y-auto rounded-xl border border-neutral-200 divide-y divide-neutral-100 bg-white">
                                    <template x-for="model in clusterModelOptions()"
                                              :key="(model.model_source || '127.0.0.1') + ':' + model.model_path">
                                        <button type="button"
                                                @click="selectClusterModel(model)"
                                                class="w-full flex items-start gap-3 px-3 py-2.5 text-left transition-colors"
                                                :class="clusterPlanModelPath === model.model_path
                                                    ? 'bg-neutral-900 text-white'
                                                    : 'hover:bg-neutral-50 text-neutral-900'">
                                            <span class="mt-0.5 w-4 h-4 rounded-full border flex items-center justify-center shrink-0"
                                                  :class="clusterPlanModelPath === model.model_path
                                                    ? 'border-white'
                                                    : 'border-neutral-300'">
                                                <span x-show="clusterPlanModelPath === model.model_path"
                                                      class="w-2 h-2 rounded-full bg-white"></span>
                                            </span>
                                            <span class="min-w-0 flex-1">
                                                <span class="block text-xs font-medium truncate" x-text="model.id"></span>
                                                <span class="block text-[10px] mt-0.5"
                                                      :class="clusterPlanModelPath === model.model_path
                                                        ? 'text-neutral-300'
                                                        : 'text-neutral-500'">
                                                    <span x-text="(model.model_type || 'MLX').toUpperCase()"></span>
                                                    <span x-text="' · ' + clusterCatalogueSize(model.estimated_size || 0)"></span>
                                                    <span x-text="' · ' + clusterModelHostsLabel(model)"></span>
                                                    <template x-if="clusterCatalogueFit(model.model_path)">
                                                        <span>
                                                            <span> · </span>
                                                            <span :class="clusterPlanModelPath === model.model_path
                                                                    ? 'text-green-300'
                                                                    : (clusterCatalogueFit(model.model_path).fits
                                                                        ? 'text-green-600'
                                                                        : 'text-red-600')"
                                                                  x-text="clusterCatalogueFit(model.model_path).fits
                                                                    ? `Fits · ${clusterCatalogueFit(model.model_path).strategy}`
                                                                    : 'Does not fit'"></span>
                                                        </span>
                                                    </template>
                                                </span>
                                            </span>
                                            <i x-show="clusterPlanModelPath === model.model_path"
                                               data-lucide="check"
                                               class="w-4 h-4 text-green-300 shrink-0"></i>
                                        </button>
                                    </template>
                                    <div x-show="!clusterModelOptions().length" x-cloak
                                         class="px-3 py-5 text-xs text-neutral-500 text-center">
                                        No downloaded models match this search.
                                    </div>
                                </div>
                            </div>

                            <!-- C4: the fabric on its own, without planning. -->
                            <div class="mt-3 pt-3 border-t border-neutral-200">
                                <div class="flex items-center justify-between gap-3">
                                    <div class="text-xs text-neutral-500">Link between Macs</div>
                                    <button @click="loadClusterTransports()"
                                            :disabled="clusterTransportsLoading"
                                            class="px-3 py-1.5 text-xs font-medium text-neutral-700 bg-white border border-neutral-200 rounded-lg hover:bg-neutral-100 disabled:opacity-50">
                                        <i data-lucide="radio" class="w-3.5 h-3.5"></i>
                                        <span x-text="clusterTransportsLoading ? 'Detecting…' : 'Detect link'"></span>
                                    </button>
                                </div>

                                <!-- Link readiness. Start Cluster handles
                                     routable-address setup through native macOS
                                     authorization; Recovery-only RDMA enablement
                                     remains an explicit exceptional state. -->
                                <template x-if="clusterLinkStatus">
                                    <div class="mt-3 rounded-xl border p-3"
                                         :class="{
                                            'border-green-200 bg-green-50': clusterLinkStatus.state === 'rdma_ready',
                                            'border-amber-200 bg-amber-50': clusterLinkStatus.state === 'rdma_needs_setup',
                                            'border-blue-200 bg-blue-50': clusterLinkStatus.state === 'ethernet',
                                            'border-neutral-200 bg-white': ['thunderbolt','rdma_not_enabled','unknown'].includes(clusterLinkStatus.state)
                                         }">
                                        <div class="flex items-start gap-2">
                                            <i :data-lucide="clusterLinkStatus.state === 'rdma_ready' ? 'circle-check'
                                                    : (clusterLinkStatus.state === 'ethernet' ? 'network' : 'triangle-alert')"
                                               class="w-4 h-4 mt-0.5 flex-shrink-0"
                                               :class="{
                                                  'text-green-600': clusterLinkStatus.state === 'rdma_ready',
                                                  'text-amber-600': clusterLinkStatus.state === 'rdma_needs_setup',
                                                  'text-blue-600': clusterLinkStatus.state === 'ethernet',
                                                  'text-neutral-500': ['thunderbolt','rdma_not_enabled','unknown'].includes(clusterLinkStatus.state)
                                               }"></i>
                                            <div class="min-w-0 flex-1">
                                                <div class="flex items-center gap-2 flex-wrap">
                                                    <span class="text-xs font-semibold text-neutral-900"
                                                          x-text="clusterLinkStatus.title"></span>
                                                    <span x-show="clusterLinkStatus.link_label"
                                                          class="px-1.5 py-0.5 rounded-full bg-white border border-neutral-200 text-[9px] font-medium text-neutral-600"
                                                          x-text="clusterLinkStatus.link_label"></span>
                                                    <span class="px-1.5 py-0.5 rounded-full bg-white border border-neutral-200 text-[9px] font-mono text-neutral-600"
                                                          x-text="clusterLinkStatus.backend"></span>
                                                </div>
                                                <p class="text-[10px] text-neutral-600 mt-1.5 leading-relaxed"
                                                   x-text="clusterLinkStatus.detail"></p>
                                            </div>
                                        </div>

                                        <template x-if="clusterLinkStatus.commands.length">
                                            <div class="mt-3">
                                                <div class="flex items-center justify-between gap-2 mb-1.5">
                                                    <span class="text-[9px] uppercase tracking-wider text-neutral-500">
                                                        Run these once per boot
                                                    </span>
                                                    <button @click="copyClusterCommands('link', clusterLinkStatus.commands)"
                                                            class="inline-flex items-center gap-1 px-2 py-1 text-[10px] font-medium text-neutral-700 bg-white border border-neutral-200 rounded-lg hover:bg-neutral-100">
                                                        <i data-lucide="copy" class="w-3 h-3"></i>
                                                        <span x-text="clusterCommandsCopied.link ? 'Copied!' : 'Copy'"></span>
                                                    </button>
                                                </div>
                                                <pre class="text-[10px] font-mono text-neutral-700 bg-white border border-neutral-200 rounded-lg p-2 overflow-x-auto"><template x-for="line in clusterLinkStatus.commands" :key="line"><div x-text="line"></div></template></pre>
                                                <p class="text-[10px] text-neutral-500 mt-1.5">
                                                    This change requires macOS Recovery and cannot be made by a running app.
                                                </p>
                                                <a x-show="clusterLinkStatus.doc_url" :href="clusterLinkStatus.doc_url"
                                                   target="_blank" rel="noopener noreferrer"
                                                   class="inline-flex items-center gap-1 text-[10px] text-neutral-500 hover:text-neutral-800 mt-1">
                                                    <i data-lucide="external-link" class="w-3 h-3"></i>
                                                    Why this is needed
                                                </a>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <div x-show="clusterTransportsError" x-cloak
                                     class="mt-2 px-3 py-2 bg-red-50 border border-red-200 rounded-lg text-[10px] text-red-700"
                                     x-text="clusterTransportsError"></div>
                                <template x-if="clusterTransports">
                                    <div class="mt-2">
                                        <div class="text-[10px] text-neutral-500">
                                            Recommended backend:
                                            <span class="font-medium text-neutral-700" x-text="clusterTransports.backend"></span>
                                        </div>
                                        <template x-if="!clusterTransports.transports.length">
                                            <div class="text-[10px] text-neutral-400 mt-1">No links detected between these hosts.</div>
                                        </template>
                                        <template x-for="(link, index) in clusterTransports.transports"
                                                  :key="'transport-' + index + ':' + (link.source_node_id || '') + '>' + link.peer_node_id + ':' + (link.kind || '')">
                                            <div class="flex items-center justify-between gap-2 mt-1 text-[10px]">
                                                <span class="font-mono text-neutral-600"
                                                      x-text="(link.source_node_id || 'this Mac') + ' → ' + link.peer_node_id"></span>
                                                <span class="font-medium"
                                                      :class="['rdma','thunderbolt'].includes(link.kind) ? 'text-green-600' : 'text-neutral-500'"
                                                      x-text="clusterTransportLabel(link)"></span>
                                            </div>
                                        </template>
                                        <p class="text-[10px] text-neutral-400 mt-2">
                                            Fast links carry tensor-parallel traffic (an all-reduce per layer). Slower hops are used for pipeline stage boundaries.
                                        </p>
                                    </div>
                                </template>
                            </div>

                            <template x-if="clusterAutoconfigure">
                                <div class="mt-3 pt-3 border-t border-neutral-200">
                                    <div class="text-xs font-medium text-neutral-800" x-text="clusterAutoconfigure.summary"></div>
                                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-3">
                                        <div>
                                            <div class="text-[9px] uppercase tracking-wider text-neutral-500">Link</div>
                                            <div class="text-xs font-medium text-neutral-700 mt-1" x-text="clusterAutoconfigure.link"></div>
                                        </div>
                                        <div>
                                            <div class="text-[9px] uppercase tracking-wider text-neutral-500">Backend</div>
                                            <div class="text-xs font-medium text-neutral-700 mt-1" x-text="clusterAutoconfigure.backend"></div>
                                        </div>
                                        <div>
                                            <div class="text-[9px] uppercase tracking-wider text-neutral-500">Split</div>
                                            <div class="text-xs font-medium text-neutral-700 mt-1"
                                                 x-text="clusterAutoconfigure.tensor_parallel_size > 1
                                                    ? clusterAutoconfigure.pipeline_stages + (clusterAutoconfigure.pipeline_stages === 1 ? ' stage' : ' stages') + ' × ' + clusterAutoconfigure.tensor_parallel_size + '-way tensor'
                                                    : clusterAutoconfigure.pipeline_stages + (clusterAutoconfigure.pipeline_stages === 1 ? ' stage' : ' stages') + ', no tensor split'"></div>
                                        </div>
                                    </div>
                                    <div class="text-[10px] text-neutral-400 mt-2" x-text="clusterAutoconfigure.backend_reason"></div>
                                    <div class="text-[10px] text-neutral-400 mt-1" x-text="clusterAutoconfigure.placement"></div>
                                    <div class="text-[10px] mt-2"
                                         :class="clusterAutoconfigure.ready_to_activate ? 'text-green-600' : 'text-amber-700'"
                                         x-text="clusterAutoconfigure.preflight"></div>

                                    <!-- Each reason activation would fail, with
                                         the command that fixes it. A rank does
                                         not die on the model it cannot fit —
                                         that is guarded — it dies on the import
                                         it cannot perform, after every other
                                         rank has paid for its weights. -->
                                    <template x-for="issue in clusterPreflightBlockers"
                                              :key="clusterIssueKey(issue)">
                                        <div class="mt-2 rounded-xl border border-amber-200 bg-amber-50 p-3">
                                            <div class="flex items-start gap-2">
                                                <i data-lucide="triangle-alert" class="w-4 h-4 mt-0.5 flex-shrink-0 text-amber-600"></i>
                                                <div class="min-w-0 flex-1">
                                                    <span class="text-xs font-semibold text-neutral-900" x-text="issue.node_id"></span>
                                                    <p class="text-[10px] text-neutral-600 mt-1 leading-relaxed break-words"
                                                       x-text="issue.detail"></p>
                                                </div>
                                            </div>
                                            <template x-if="issue.remediation">
                                                <div class="mt-3">
                                                    <div class="flex items-center justify-between gap-2 mb-1.5">
                                                        <span class="text-[9px] uppercase tracking-wider text-neutral-500">
                                                            Run this to fix it
                                                        </span>
                                                        <button @click="copyClusterCommands(clusterIssueKey(issue), [issue.remediation])"
                                                                class="inline-flex items-center gap-1 px-2 py-1 text-[10px] font-medium text-neutral-700 bg-white border border-neutral-200 rounded-lg hover:bg-neutral-100">
                                                            <i data-lucide="copy" class="w-3 h-3"></i>
                                                            <span x-text="clusterCommandsCopied[clusterIssueKey(issue)] ? 'Copied!' : 'Copy'"></span>
                                                        </button>
                                                    </div>
                                                    <pre class="text-[10px] font-mono text-neutral-700 bg-white border border-neutral-200 rounded-lg p-2 overflow-x-auto" x-text="issue.remediation"></pre>
                                                </div>
                                            </template>
                                            <p x-show="!issue.remediation" x-cloak
                                               class="text-[10px] text-neutral-500 mt-2">
                                                No single command fixes this one — it has to be settled on every Mac.
                                            </p>
                                        </div>
                                    </template>

                                    <!-- Model staging: each Mac needs only the shards
                                         holding its own layers, not the whole model. -->
                                    <template x-if="clusterAutoconfigure.staging && !clusterAutoconfigure.staging.ready">
                                        <div class="mt-3 pt-3 border-t border-neutral-200">
                                            <div class="flex items-start justify-between gap-3">
                                                <div class="min-w-0">
                                                    <div class="text-xs font-semibold text-neutral-900">Preparing model on every Mac</div>
                                                    <template x-for="n in clusterAutoconfigure.staging.nodes.filter(n => n.missing_files > 0)" :key="n.node_id">
                                                        <div class="text-[10px] text-neutral-600 mt-1">
                                                            <span class="font-mono" x-text="n.node_id"></span>
                                                            <span x-text="' — ' + formatClusterStaging(n)"></span>
                                                        </div>
                                                    </template>
                                                </div>
                                                <button @click="stageClusterModel()"
                                                        :disabled="clusterStagingLoading"
                                                        class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-neutral-700 bg-white border border-neutral-200 rounded-lg hover:bg-neutral-100 disabled:opacity-50 whitespace-nowrap shrink-0">
                                                    <i data-lucide="download" class="w-3.5 h-3.5"></i>
                                                    <span x-text="clusterStagingLoading ? 'Copying…' : 'Prepare now'"></span>
                                                </button>
                                            </div>
                                            <template x-if="clusterStagingResult">
                                                <div class="mt-2 space-y-1">
                                                    <template x-for="node in clusterStagingNodes()" :key="node.node_id">
                                                        <div class="flex items-center justify-between gap-3 text-[10px]">
                                                            <span class="font-medium text-neutral-700" x-text="node.node_id"></span>
                                                            <span :class="node.status === 'failed' ? 'text-red-600' : (node.status === 'ready' ? 'text-green-600' : 'text-neutral-500')"
                                                                  x-text="clusterStagingNodeProgress(node)"></span>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <template x-for="warning in clusterAutoconfigure.warnings" :key="warning">
                                        <div class="mt-2 px-3 py-2 bg-amber-50 border border-amber-200 rounded-lg text-[10px] text-amber-800" x-text="warning"></div>
                                    </template>
                                    <p class="text-[10px] text-neutral-400 mt-3">
                                        Review the plan below, then activate. Activation starts processes on every selected worker.
                                    </p>
                                </div>
                            </template>
                        </div>

                        <div class="flex items-center justify-between gap-3 mb-3">
                            <h5 class="text-sm font-semibold text-neutral-900">Rank-ordered nodes</h5>
                        </div>
                        <div class="flex items-center gap-4 mb-4">
                            <label class="block text-xs font-medium text-neutral-600">Workload</label>
                            <select x-model="clusterExecutionProfile"
                                    @change="invalidateClusterPlan()"
                                    class="text-xs border border-neutral-200 rounded-lg px-2 py-1 focus:ring-2 focus:ring-neutral-900 focus:border-transparent">
                                <option value="interactive">Interactive — lowest latency for chat</option>
                                <option value="balanced">Balanced</option>
                                <option value="throughput">Throughput — batch and long context</option>
                            </select>
                        </div>
                        <div class="mb-4 rounded-xl border border-neutral-200 bg-white">
                            <button type="button"
                                    @click="clusterShowAdvanced = !clusterShowAdvanced"
                                    :aria-expanded="clusterShowAdvanced"
                                    class="w-full flex items-center justify-between gap-3 px-4 py-3 text-left">
                                <div>
                                    <div class="text-xs font-semibold text-neutral-800">Advanced activation settings</div>
                                    <div class="text-[10px] text-neutral-500 mt-0.5">
                                        Runtime tuning, cache behaviour, and transport limits
                                    </div>
                                </div>
                                <i data-lucide="chevron-down"
                                   class="w-4 h-4 text-neutral-400 transition-transform"
                                   :class="{ 'rotate-180': clusterShowAdvanced }"></i>
                            </button>
                            <div x-show="clusterShowAdvanced" x-cloak
                                 class="border-t border-neutral-200 px-4 py-4 space-y-4">
                                <div class="grid grid-cols-1 gap-4">
                                    <label class="block">
                                        <span class="block text-xs font-medium text-neutral-600 mb-1.5">Automatic setup preference</span>
                                        <select x-model="clusterAutoconfigurePrefer"
                                                class="w-full text-xs border border-neutral-200 rounded-lg px-2 py-1.5 focus:ring-2 focus:ring-neutral-900 focus:border-transparent">
                                            <option value="speed">Speed — favour tensor parallelism</option>
                                            <option value="capacity">Capacity — favour pipeline stages</option>
                                        </select>
                                    </label>
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <label class="flex items-start gap-2 text-xs text-neutral-700">
                                        <input type="checkbox" x-model="clusterAutoTune"
                                               class="mt-0.5 rounded border-neutral-300 text-neutral-900 focus:ring-neutral-900">
                                        <span><span class="font-medium">Auto tune</span><span class="block text-[10px] text-neutral-500 mt-0.5">Benchmark the accelerators and links before launch.</span></span>
                                    </label>
                                    <label class="flex items-start gap-2 text-xs text-neutral-700">
                                        <input type="checkbox" x-model="clusterAsyncOverlap"
                                               class="mt-0.5 rounded border-neutral-300 text-neutral-900 focus:ring-neutral-900">
                                        <span><span class="font-medium">Async overlap</span><span class="block text-[10px] text-neutral-500 mt-0.5">Overlap pipeline communication and compute.</span></span>
                                    </label>
                                    <label class="flex items-start gap-2 text-xs text-neutral-700">
                                        <input type="checkbox" x-model="clusterCacheAffinity"
                                               class="mt-0.5 rounded border-neutral-300 text-neutral-900 focus:ring-neutral-900">
                                        <span><span class="font-medium">Cache affinity</span><span class="block text-[10px] text-neutral-500 mt-0.5">Prefer ranks with reusable prompt cache state.</span></span>
                                    </label>
                                    <label class="flex items-start gap-2 text-xs text-neutral-700">
                                        <input type="checkbox" x-model="clusterSamplingRankOnly"
                                               class="mt-0.5 rounded border-neutral-300 text-neutral-900 focus:ring-neutral-900">
                                        <span><span class="font-medium">Token-only rank output</span><span class="block text-[10px] text-neutral-500 mt-0.5">Avoid full hidden-state transfers when the model supports the validated fast path; otherwise oMLX falls back automatically.</span></span>
                                    </label>
                                </div>
                                <label x-show="clusterBackend === 'ring'" x-cloak class="block">
                                    <span class="block text-xs font-medium text-neutral-600 mb-1.5">Ring connections per IP</span>
                                    <input type="number"
                                           x-model.number="clusterRingConnectionsPerIp"
                                           min="1"
                                           max="32"
                                           step="1"
                                           class="w-full sm:w-40 text-xs border border-neutral-200 rounded-lg px-2 py-1.5 focus:ring-2 focus:ring-neutral-900 focus:border-transparent">
                                    <span class="block text-[10px] text-neutral-500 mt-1">Used only by the Ring backend.</span>
                                </label>
                            </div>
                        </div>
                        <!-- What the split actually buys: one Mac would need the
                             whole model resident; under TP each holds a share. -->
                        <template x-if="clusterAutoconfigure && clusterAutoconfigure.plan">
                            <div class="mb-4 rounded-xl border border-neutral-200 bg-white p-3">
                                <div class="text-[9px] uppercase tracking-wider text-neutral-500">Memory per accelerator</div>
                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-2">
                                    <div>
                                        <div class="text-[10px] text-neutral-500">On one accelerator alone</div>
                                        <div class="text-xs font-medium text-neutral-700 mt-1"
                                             x-text="formatClusterGiB(clusterAutoconfigure.plan.model.total_weight_bytes)"></div>
                                    </div>
                                    <div>
                                        <div class="text-[10px] text-neutral-500">Largest share now</div>
                                        <div class="text-xs font-medium text-green-600 mt-1"
                                             x-text="formatClusterGiB(Math.max(...clusterAutoconfigure.plan.assignments.map(a => a.planned_weight_bytes)))"></div>
                                    </div>
                                    <div>
                                        <div class="text-[10px] text-neutral-500">Saved per accelerator</div>
                                        <div class="text-xs font-medium text-green-600 mt-1"
                                             x-text="formatClusterGiB(
                                                clusterAutoconfigure.plan.model.total_weight_bytes
                                                - Math.max(...clusterAutoconfigure.plan.assignments.map(a => a.planned_weight_bytes)))"></div>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <div class="flex items-center gap-4 mb-4">
                            <label class="block text-xs font-medium text-neutral-600">Tensor parallelism</label>
                            <div class="inline-flex items-center rounded-lg border border-neutral-200 bg-white p-0.5">
                                <template x-for="size in clusterTensorParallelOptions()" :key="size">
                                    <button type="button"
                                            @click="clusterPlanTensorParallelSize = size; invalidateClusterPlan()"
                                            class="px-2.5 py-1 text-xs font-medium rounded-md transition-colors"
                                            :class="Number(clusterPlanTensorParallelSize) === size
                                                ? 'bg-neutral-900 text-white'
                                                : 'text-neutral-600 hover:bg-neutral-100'"
                                            x-text="size === 1
                                                ? 'Pipeline only'
                                                : `${size}-way tensor`"></button>
                                </template>
                            </div>
                            <span class="text-xs text-neutral-400" x-text="clusterPlanTensorParallelSize > 1
                                ? 'Every detected accelerator works on every token'
                                : `Each of the ${clusterPlanNodes.length} detected accelerators holds different layers`"></span>
                        </div>
                        <div x-show="clusterPlanError" x-cloak
                             class="mt-4 px-4 py-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-700"
                             x-text="clusterPlanError"></div>
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mt-5">
                            <p class="text-xs text-neutral-400">
                                Auto optimisation benchmarks every accelerator and selected link during activation.
                            </p>
                            <button @click="runClusterPlan()"
                                    :disabled="clusterPlanLoading"
                                    class="inline-flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-medium text-white bg-neutral-900 rounded-xl hover:bg-neutral-800 disabled:opacity-50 transition-all flex-shrink-0">
                                <i data-lucide="wand-sparkles" class="w-4 h-4"></i>
                                <span x-text="clusterPlanLoading ? 'Planning…' : 'Build plan'"></span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- What each device may give. Installed memory overstates a
                     MacBook by ~20 GiB (the GPU cannot address it all), and a
                     Mac someone is working on must not be planned like a shelf
                     appliance. Both are set here rather than assumed. -->
                <div x-show="clusterShowSetupDetails" x-cloak
                     class="bg-white border border-neutral-200 rounded-2xl overflow-hidden mt-4"
                     x-init="loadClusterNodeRoles()">
                    <div class="px-6 py-4 border-b border-neutral-200 flex items-center justify-between gap-3">
                        <div>
                            <div class="text-xs font-bold uppercase tracking-wider text-neutral-900">Memory each accelerator gives</div>
                            <p class="text-xs text-neutral-500 mt-1">
                                Measured from the safe allocation cap, not installed memory.
                            </p>
                        </div>
                        <button @click="measureClusterBudgets()"
                                :disabled="clusterBudgetsLoading"
                                class="px-3 py-1.5 text-xs font-medium text-neutral-700 bg-white border border-neutral-200 rounded-lg hover:bg-neutral-100 disabled:opacity-50 shrink-0">
                            <i data-lucide="gauge" class="w-3.5 h-3.5"></i>
                            <span x-text="clusterBudgetsLoading ? 'Measuring…' : 'Measure devices'"></span>
                        </button>
                    </div>

                    <div class="p-6 space-y-3">
                        <div x-show="clusterBudgetsError" x-cloak
                             class="px-3 py-2 bg-red-50 border border-red-200 rounded-lg text-xs text-red-700"
                             x-text="clusterBudgetsError"></div>

                        <template x-for="node in clusterPlanNodes" :key="node.key">
                            <div class="rounded-xl border border-neutral-200 p-3">
                                <div class="flex items-center justify-between gap-3">
                                    <span class="text-xs font-semibold text-neutral-900" x-text="node.node_id"></span>
                                    <div class="flex gap-1.5">
                                        <template x-for="role in clusterNodeRoles" :key="role.key">
                                            <button @click="node.role = role.key"
                                                    @mouseenter="clusterRoleTooltip = role.key"
                                                    @mouseleave="clusterRoleTooltip = ''"
                                                    class="px-2.5 py-1 text-[11px] font-medium rounded-lg border transition-colors"
                                                    :class="node.role === role.key
                                                        ? 'bg-neutral-900 text-white border-neutral-900'
                                                        : 'bg-white text-neutral-600 border-neutral-200 hover:bg-neutral-50'"
                                                    x-text="role.label"></button>
                                        </template>
                                    </div>
                                </div>
                                <div class="text-[10px] text-neutral-500 mt-1.5"
                                     x-text="clusterRoleSummary(node.role)"></div>
                                <div class="text-[10px] text-neutral-400 mt-1 font-mono"
                                     x-text="node.measured
                                        || `${node.capacity_gib} GiB capacity, ${node.reserve_gib} GiB held back`"></div>
                                <!-- An automatic role can raise an untouched
                                     form default. A moved cockpit slider is
                                     explicit and remains authoritative. If
                                     another constraint changes the plan, show
                                     the actual reserve rather than claiming a
                                     number no rank will honour. -->
                                <!-- x-show only hides; x-text still runs, so
                                     this must survive there being no plan. -->
                                <div x-show="clusterPlannedReserveGiB(node.node_id) !== null
                                        && Math.abs(clusterPlannedReserveGiB(node.node_id) - Number(node.reserve_gib)) >= 1"
                                     x-cloak
                                     class="text-[10px] text-amber-700 mt-1"
                                     x-text="`This role holds back ${(clusterPlannedReserveGiB(node.node_id) || 0).toFixed(1)} GiB in the plan.`"></div>
                            </div>
                        </template>

                        <!-- The tooltip: why this choice matters, not what it is. -->
                        <div x-show="clusterRoleTooltip" x-cloak
                             class="rounded-xl bg-neutral-50 border border-neutral-200 px-4 py-3">
                            <div class="text-[11px] font-semibold text-neutral-900"
                                 x-text="(clusterNodeRoles.find(r => r.key === clusterRoleTooltip) || {}).label"></div>
                            <p class="text-[11px] text-neutral-600 mt-1 leading-relaxed"
                               x-text="clusterRoleDetail(clusterRoleTooltip)"></p>
                        </div>
                    </div>
                </div>

                <!-- Model shard balance. Weights are only half the memory story:
                     the layers a device holds set how much KV cache fits beside
                     them, so moving the split moves the usable context. Shown
                     live, because the trade is not obvious from the numbers
                     going in. -->
                <template x-if="clusterShowSetupDetails && clusterWeightPlan() && clusterSplitAvailable()">
                    <div class="bg-white border border-neutral-200 rounded-2xl overflow-hidden mt-4">
                        <div class="px-6 py-4 border-b border-neutral-200">
                            <div class="flex items-center justify-between gap-3">
                                <div>
                                    <div class="text-xs font-bold uppercase tracking-wider text-neutral-900">Model shard balance</div>
                                    <p class="text-xs text-neutral-500 mt-1">
                                        Automatic uses measured memory and speed. Move a device's target to put
                                        more layers there; every override is re-checked before launch.
                                    </p>
                                </div>
                                <button @click="clusterResetSplit()"
                                        x-show="clusterWeightTargetsCustomized()" x-cloak
                                        class="px-3 py-1.5 text-xs font-medium text-neutral-700 bg-white border border-neutral-200 rounded-lg hover:bg-neutral-100 shrink-0">
                                    Auto balance
                                </button>
                            </div>
                        </div>

                        <div class="p-6">
                            <!-- The split as it stands, node by node. -->
                            <div class="flex h-8 rounded-lg overflow-hidden border border-neutral-200">
                                <template x-for="item in clusterPlanAssignmentsByLayer()" :key="item.rank">
                                    <div class="flex items-center justify-center text-[10px] font-medium text-white"
                                         :class="item.rank === 0 ? 'bg-neutral-900' : 'bg-neutral-500'"
                                         :style="`width: ${clusterSplitPercent(item)}%`"
                                         x-text="item.node_id"></div>
                                </template>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
                                <template x-for="(node, index) in clusterWeightNodes()"
                                          :key="'advanced-slider-' + node.rank">
                                    <label class="rounded-xl border border-neutral-200 p-3">
                                        <span class="flex items-center justify-between gap-3">
                                            <span class="text-xs font-semibold text-neutral-900"
                                                  x-text="node.node_id"></span>
                                            <span class="text-[10px] font-mono text-neutral-500"
                                                  x-text="clusterWeightTargetGiB(node).toFixed(1) + ' GiB'"></span>
                                        </span>
                                        <input type="range"
                                               class="w-full mt-2 accent-neutral-900"
                                               :min="clusterWeightBounds(node).min"
                                               :max="clusterWeightBounds(node).max"
                                               :step="clusterWeightBounds(node).step"
                                               :value="clusterWeightTargetGiB(node)"
                                               @input="clusterSetWeightTarget(
                                                    node, Number($event.target.value)
                                               )"
                                               @change="clusterSplitChanged()">
                                        <span class="text-[9px] text-neutral-400"
                                              x-text="'Planner placed ' + node.actualGiB.toFixed(1)
                                                + ' GiB on this accelerator'"></span>
                                    </label>
                                </template>
                            </div>

                            <!-- Per-node: weights, the cache that fits beside
                                 them, and the context that buys. -->
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-5">
                                <template x-for="item in clusterPlanAssignmentsByLayer()" :key="'kv-' + item.rank">
                                    <div class="rounded-xl border border-neutral-200 p-3">
                                        <div class="flex items-center justify-between">
                                            <span class="text-xs font-semibold text-neutral-900" x-text="item.node_id"></span>
                                            <span class="text-[10px] text-neutral-400"
                                                  x-text="`layers ${item.start_layer}–${item.end_layer}`"></span>
                                        </div>
                                        <dl class="mt-2 space-y-1">
                                            <div class="flex justify-between text-[11px]">
                                                <dt class="text-neutral-500">Model weights</dt>
                                                <dd class="font-mono text-neutral-900"
                                                    x-text="clusterGiB(item.layer_weight_bytes + item.fixed_weight_bytes)"></dd>
                                            </div>
                                            <div class="flex justify-between text-[11px]">
                                                <dt class="text-neutral-500">KV cache reserved</dt>
                                                <dd class="font-mono text-neutral-900" x-text="clusterGiB(item.kv_cache_bytes)"></dd>
                                            </div>
                                            <!-- The role's only visible effect
                                                 used to be a tooltip. This is
                                                 the number it actually sets,
                                                 read back from the plan that
                                                 will launch. -->
                                            <div class="flex justify-between text-[11px]">
                                                <dt class="text-neutral-500"
                                                    x-text="item.role === 'workstation' ? 'Held back for you' : 'Held back'"></dt>
                                                <dd class="font-mono text-neutral-900" x-text="clusterGiB(item.reserve_bytes)"></dd>
                                            </div>
                                            <div class="flex justify-between text-[11px]">
                                                <dt class="text-neutral-500">Free after that</dt>
                                                <dd class="font-mono text-neutral-900" x-text="clusterGiB(item.headroom_bytes)"></dd>
                                            </div>
                                            <div class="flex justify-between text-[11px] pt-1 border-t border-neutral-100">
                                                <dt class="text-neutral-500">Holds up to</dt>
                                                <dd class="font-mono font-semibold text-neutral-900"
                                                    x-text="`${clusterTokens(item.max_context_tokens)} tokens`"></dd>
                                            </div>
                                        </dl>
                                    </div>
                                </template>
                            </div>

                            <!-- The number that actually governs: a request
                                 passes through every stage, so the shortest
                                 one is the cluster's limit. -->
                            <div class="mt-4 rounded-xl border border-neutral-200 bg-neutral-50 px-4 py-3">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs text-neutral-600">This cluster serves up to</span>
                                    <span class="text-sm font-semibold text-neutral-900"
                                          x-text="`${clusterTokens(clusterPlan.cluster?.max_context_tokens)} tokens`"></span>
                                </div>
                                <p class="text-[10px] text-neutral-500 mt-1">
                                    Set by the Mac with the least room left — a request passes through every stage.
                                </p>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Activation -->
                <div x-show="clusterShowSetupDetails && clusterShowAdvanced" x-cloak
                     class="bg-white border border-neutral-200 rounded-2xl overflow-hidden"
                     data-cluster-activation>
                    <div class="px-6 py-4 bg-neutral-900 text-white">
                        <div class="flex items-center gap-2">
                            <i data-lucide="power" class="w-4 h-4 text-green-400"></i>
                            <span class="text-xs font-bold uppercase tracking-wider">3 · Manual activation</span>
                        </div>
                        <p class="text-xs text-neutral-400 mt-1">Advanced fallback for reviewing and activating a hand-tuned plan separately.</p>
                    </div>
                    <div class="p-6">
                        <div class="rounded-xl bg-amber-50 border border-amber-200 px-4 py-3 text-xs text-amber-800 mb-5">
                            oMLX stages the model files each rank needs at the selected path automatically. KV cache remains rank-local beside each rank's layers;
                            the memory reserve in the plan is deliberately left available for cache, activations, and runtime overhead.
                        </div>
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                            <div class="text-xs text-neutral-500">
                                <span x-show="clusterPlanMode !== 'model'">Choose <strong>Downloaded model</strong> and build its real plan to continue.</span>
                                <span x-show="clusterPlanMode === 'model' && !clusterPeerProbe?.runtime_compatible">Verify a runtime-compatible peer to continue.</span>
                                <span x-show="clusterPlanMode === 'model' && clusterPeerProbe?.runtime_compatible && !clusterPlan">Build the shard plan to continue.</span>
                                <!-- A budget, a role or the split moved after
                                     the plan was built. The server refuses to
                                     activate a plan nobody approved, so say
                                     which control invalidated it rather than
                                     letting the button go quiet. -->
                                <span x-show="clusterPlanIsStale()" x-cloak
                                      class="text-amber-700">Memory, role or split changed since this plan was built — build it again so you approve what launches.</span>
                                <span x-show="clusterPreflightBlockers.length" x-cloak
                                      class="text-amber-700"
                                      x-text="`Run the ${clusterPreflightBlockers.length === 1 ? 'command' : 'commands'} in step 2 first — a peer that cannot import what this model needs dies part-way through the load.`"></span>
                                <span x-show="clusterActivationReady()">Ready: activation re-runs planning and strict SSH preflight server-side.</span>
                            </div>
                            <button @click="activateClusterDeployment()"
                                    :disabled="!clusterActivationReady()"
                                    class="inline-flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-semibold text-white bg-neutral-900 rounded-xl hover:bg-neutral-800 disabled:opacity-50 disabled:cursor-not-allowed transition-all flex-shrink-0">
                                <i data-lucide="network" class="w-4 h-4"></i>
                                <span x-text="clusterActivationLoading
                                    ? (clusterActivationProgress || 'Preflighting…')
                                    : 'Activate manual plan'"></span>
                            </button>
                        </div>

                        <!-- Automatic tuning can propose another split after
                             measuring the link. A proposal may be useful
                             evidence, but the signed and already-staged rank
                             map remains the one that launches. -->
                        <template x-if="clusterPlanChanges && clusterPlanChanges.changed">
                            <div class="mt-5 rounded-xl border border-blue-200 bg-blue-50 px-4 py-3"
                                 data-cluster-plan-changes>
                                <div class="flex items-center gap-2">
                                    <i data-lucide="shield-check" class="w-4 h-4 text-blue-700"></i>
                                    <span class="text-xs font-semibold text-blue-900">Signed placement kept</span>
                                </div>
                                <p class="text-[11px] text-blue-800 mt-1"
                                   x-text="clusterPlanChanges.reason"></p>
                                <ul class="mt-2 space-y-1">
                                    <template x-for="change in clusterPlanChanges.ranks" :key="'plan-change-' + change.rank">
                                        <li class="text-[11px] font-mono text-blue-900"
                                            x-text="change.summary"></li>
                                    </template>
                                </ul>
                                <p class="text-[11px] text-blue-800 mt-2">
                                    oMLX did not apply that candidate because it would no longer match the files and memory split you approved.
                                </p>
                            </div>
                        </template>

                        <template x-if="clusterActivationResult && clusterPlanChanges && !clusterPlanChanges.changed">
                            <div class="mt-5 rounded-xl border border-neutral-200 bg-neutral-50 px-4 py-3 text-[11px] text-neutral-600"
                                 data-cluster-plan-changes>
                                Activated exactly the plan shown above — same layers, same reserves, same roles.
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>
    </div>
</div>
