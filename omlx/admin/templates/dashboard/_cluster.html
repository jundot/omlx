<div x-show="mainTab === 'cluster'" x-cloak data-cluster-view>
    <div class="animate-fade-in-up">
        <!-- The normal path describes the outcome, not the distributed system. -->
        <div class="mb-6">
            <h2 class="text-2xl font-bold tracking-tight text-neutral-900">Use your accelerator pool together</h2>
            <p class="text-sm text-neutral-500 mt-2 max-w-2xl">
                oMLX finds Metal and CUDA workers, checks their connections and
                usable memory, and chooses how to shard each model.
            </p>
        </div>

        <!-- Errors. The raw message stays visible — it is what you paste into a
             bug report — but the actionable version leads. -->
        <div x-show="clusterDisplayedError()" x-cloak
             class="mb-6 rounded-xl border border-red-200 bg-red-50 overflow-hidden">
            <div class="flex items-start gap-3 px-4 py-3 text-sm text-red-800">
                <i data-lucide="circle-alert" class="w-4 h-4 mt-0.5 flex-shrink-0"></i>
                <div class="min-w-0 flex-1">
                    <div class="font-semibold"
                         x-text="clusterGuidance ? clusterGuidance.title : clusterDisplayedError()"></div>
                    <div class="text-xs text-red-700 mt-1"
                         x-show="clusterGuidance"
                         x-text="clusterGuidance ? clusterGuidance.explanation : ''"></div>
                </div>
                <button @click="dismissClusterErrorBanner()"
                        class="p-1 text-red-400 hover:text-red-700 flex-shrink-0"
                        aria-label="Dismiss">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
            </div>
            <template x-if="clusterGuidance && clusterGuidance.steps.length">
                <ul class="px-4 pb-3 space-y-1.5">
                    <template x-for="(step, index) in clusterGuidance.steps" :key="index">
                        <li class="flex items-start gap-2 text-xs text-red-800">
                            <span class="mt-0.5 w-4 h-4 rounded-full bg-red-100 border border-red-300 text-[9px] font-semibold flex items-center justify-center flex-shrink-0"
                                  x-text="index + 1"></span>
                            <span x-text="step"></span>
                        </li>
                    </template>
                </ul>
            </template>
            <template x-if="clusterGuidance && clusterGuidance.doc_anchor === 'pairing'">
                <div class="px-4 pb-3 space-y-2">
                    <button type="button"
                            @click="openClusterPairingSetup()"
                            class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-red-800 bg-white border border-red-300 rounded-lg hover:bg-red-100">
                        <i data-lucide="key-round" class="w-3.5 h-3.5"></i>
                        Open SSH setup in oMLX
                    </button>
                    <template x-if="clusterGuidance.command">
                        <div class="rounded-lg border border-red-200 bg-white p-3">
                            <div class="flex items-center justify-between gap-2 mb-1.5">
                                <span class="text-[10px] font-semibold uppercase tracking-wider text-red-700">
                                    Or run this in Terminal on this Mac
                                </span>
                                <button type="button"
                                        @click="copyClusterCommands('pairingRecovery', [clusterGuidance.command])"
                                        class="inline-flex items-center gap-1 px-2 py-1 text-[10px] font-medium text-red-800 border border-red-200 rounded-md hover:bg-red-50">
                                    <i data-lucide="copy" class="w-3 h-3"></i>
                                    <span x-text="clusterCommandsCopied.pairingRecovery ? 'Copied!' : 'Copy'"></span>
                                </button>
                            </div>
                            <pre class="text-[10px] font-mono text-neutral-700 whitespace-pre-wrap break-all" x-text="clusterGuidance.command"></pre>
                            <details x-show="clusterGuidance.keygen_command" class="mt-2 pt-2 border-t border-red-100">
                                <summary class="text-[10px] text-red-700 cursor-pointer select-none"
                                         title="oMLX normally generates this key for you">
                                    Don't have the oMLX SSH key yet?
                                </summary>
                                <p class="text-[10px] text-neutral-500 mt-1">
                                    Generate it first in Terminal, then run the command above.
                                </p>
                                <div class="flex items-start gap-2 mt-1.5">
                                    <code class="flex-1 text-[10px] text-neutral-700 break-all"
                                          x-text="clusterGuidance.keygen_command"></code>
                                    <button type="button"
                                            @click="copyClusterCommands('pairingKeygen', [clusterGuidance.keygen_command])"
                                            class="px-2 py-1 text-[10px] font-medium text-red-800 border border-red-200 rounded-md hover:bg-red-50"
                                            x-text="clusterCommandsCopied.pairingKeygen ? 'Copied!' : 'Copy'"></button>
                                </div>
                            </details>
                        </div>
                    </template>
                </div>
            </template>
            <details class="border-t border-red-200 bg-red-100/50">
                <summary class="px-4 py-2 text-[10px] uppercase tracking-wider text-red-600 cursor-pointer select-none">
                    Technical detail
                </summary>
                <div class="px-4 pb-3 text-[11px] font-mono text-red-700 break-all" x-text="clusterDisplayedError()"></div>
            </details>
        </div>

        <!-- Server-owned incident feed. Polls merge into this list and never
             delete: the badge and rows survive browser reloads because the
             records live on the coordinator, not in component state. B4 gives
             this the full three-surface layout; this is the minimal render. -->
        <details x-show="clusterActiveIncidents().length" x-cloak
                 class="mb-6 rounded-xl border border-amber-200 bg-amber-50 overflow-hidden">
            <summary class="flex items-center gap-2 px-4 py-2.5 text-sm text-amber-900 cursor-pointer select-none">
                <i data-lucide="bell-ring" class="w-4 h-4 flex-shrink-0"></i>
                <span class="font-semibold">Cluster incidents</span>
                <span class="inline-flex items-center justify-center min-w-[1.25rem] h-5 px-1.5 rounded-full bg-amber-600 text-white text-[10px] font-bold"
                      x-text="clusterActiveIncidents().length"></span>
            </summary>
            <ul class="border-t border-amber-200 divide-y divide-amber-100 max-h-72 overflow-y-auto">
                <template x-for="incident in clusterActiveIncidents()" :key="incident.id">
                    <li class="flex items-start gap-2.5 px-4 py-2.5 text-xs">
                        <span class="mt-1 w-2 h-2 rounded-full flex-shrink-0"
                              :class="{
                                  'bg-red-500': incident.severity === 'error',
                                  'bg-amber-500': incident.severity === 'warn',
                                  'bg-neutral-400': incident.severity === 'info'
                              }"></span>
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-2 text-[10px] text-amber-800">
                                <span class="font-semibold uppercase tracking-wider" x-text="incident.severity"></span>
                                <span class="font-mono" x-text="incident.source"></span>
                                <span x-text="clusterIncidentAge(incident.ts)"></span>
                                <span x-show="incident.superseded_by" class="italic">superseded</span>
                            </div>
                            <div class="text-amber-900 mt-0.5 break-words" x-text="incident.message"></div>
                        </div>
                        <button type="button"
                                @click="dismissClusterIncident(incident.id)"
                                class="px-2 py-1 text-[10px] font-medium text-amber-800 border border-amber-300 rounded-md hover:bg-amber-100 flex-shrink-0">
                            Dismiss
                        </button>
                    </li>
                </template>
            </ul>
        </details>

        <!-- Where you are in setting up a cluster. Four states, in order. -->
        <div x-show="clusterStatus && clusterShowSetupDetails" x-cloak class="mb-6">
            <ol class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                <template x-for="(step, index) in clusterSteps" :key="step.key">
                    <li class="relative rounded-xl border p-3 transition-colors"
                        :class="{
                            'border-green-200 bg-green-50': step.state === 'done',
                            'border-neutral-900 bg-white ring-1 ring-neutral-900': step.state === 'active',
                            'border-neutral-200 bg-neutral-50': step.state === 'todo'
                        }">
                        <div class="flex items-center gap-2">
                            <span class="w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center flex-shrink-0"
                                  :class="{
                                      'bg-green-500 text-white': step.state === 'done',
                                      'bg-neutral-900 text-white': step.state === 'active',
                                      'bg-neutral-200 text-neutral-500': step.state === 'todo'
                                  }">
                                <template x-if="step.state === 'done'">
                                    <i data-lucide="check" class="w-3 h-3"></i>
                                </template>
                                <template x-if="step.state !== 'done'">
                                    <span x-text="index + 1"></span>
                                </template>
                            </span>
                            <span class="text-xs font-semibold"
                                  :class="step.state === 'todo' ? 'text-neutral-500' : 'text-neutral-900'"
                                  x-text="step.title"></span>
                        </div>
                        <div class="text-[10px] mt-1.5 pl-7 truncate"
                             :class="step.state === 'todo' ? 'text-neutral-400' : 'text-neutral-600'"
                             :title="step.hint"
                             x-text="step.hint"></div>
                    </li>
                </template>
            </ol>
        </div>

        <!-- Pick up where you left off. -->
        <template x-if="clusterLastGoodConfig && !clusterAutoconfigure && clusterShowSetupDetails">
            <div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 rounded-xl border border-neutral-200 bg-white px-4 py-3">
                <div class="min-w-0">
                    <div class="text-xs font-semibold text-neutral-900">Resume your last cluster</div>
                    <div class="text-[10px] text-neutral-500 mt-0.5">
                        The settings that worked last time are ready to reuse.
                    </div>
                </div>
                <button @click="startCluster()"
                        :disabled="clusterLinkSetupLoading || clusterAutoconfigureLoading || clusterActivationLoading"
                        class="inline-flex items-center gap-2 px-3 py-1.5 text-xs font-medium text-neutral-700 bg-white border border-neutral-200 rounded-lg hover:bg-neutral-100 whitespace-nowrap">
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                    Start again
                </button>
            </div>
        </template>

        <!-- Loading state -->
        <div x-show="clusterLoading && !clusterStatus" x-cloak class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 mb-6">
            <template x-for="index in 4" :key="index">
                <div class="h-32 bg-neutral-100 rounded-2xl animate-pulse"></div>
            </template>
        </div>

        <template x-if="clusterStatus">
            <div>
                <!-- The product path: the detected Macs, one model, one button.
                     Everything that explains or overrides the automatic
                     decisions lives under Advanced setup below. -->
                <section class="bg-white border border-neutral-200 rounded-2xl overflow-hidden mb-4"
                         data-cluster-quick-start>
                    <div class="p-5 sm:p-6">
                        <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3">
                            <div>
                                <div class="text-xs font-bold uppercase tracking-wider text-neutral-400">Your compute pool</div>
                                <h4 class="text-lg font-semibold text-neutral-900 mt-1"
                                    x-text="clusterPairTitle()"></h4>
                                <p class="text-xs text-neutral-500 mt-1"
                                   x-text="clusterQuickStatus().detail"></p>
                            </div>
                            <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold self-start"
                                  :class="clusterQuickStatusTone()"
                                  data-cluster-quick-status>
                                <span class="w-2 h-2 rounded-full bg-current"
                                      :class="{ 'animate-pulse': clusterQuickStatus().busy }"></span>
                                <span x-text="clusterQuickStatus().label"></span>
                            </span>
                        </div>

                        <div class="mt-5" data-cluster-topology>
                            <div class="cluster-fabric"
                                 data-cluster-neural-fabric
                                 :data-state="clusterNeuralFabricMode()"
                                 :class="{ 'cluster-fabric--firing': clusterNeuralFabricFiring() }">
                                <div class="cluster-fabric__header">
                                    <div>
                                        <div class="cluster-fabric__eyebrow">
                                            <span class="cluster-fabric__live-dot"></span>
                                            Neural fabric
                                        </div>
                                        <div class="cluster-fabric__title"
                                             x-text="clusterNeuralFabricLabel()"></div>
                                    </div>
                                    <div class="cluster-fabric__connection">
                                        <i data-lucide="cable" class="w-3.5 h-3.5"></i>
                                        <span x-text="clusterFriendlyConnectionLabel()"></span>
                                        <span class="cluster-fabric__connection-separator">·</span>
                                        <span x-text="clusterDeviceCountLabel()"></span>
                                    </div>
                                </div>

                                <div x-show="clusterNeuralFabricJob()?.live"
                                     x-cloak
                                     class="cluster-fabric__cockpit"
                                     data-cluster-live-summary>
                                    <div class="cluster-fabric__live-model">
                                        <span class="cluster-fabric__live-label">
                                            <span class="cluster-fabric__live-status"></span>
                                            Cluster live
                                        </span>
                                        <strong x-text="clusterLiveModelName()"></strong>
                                        <span x-text="clusterLiveModelId()"></span>
                                    </div>
                                    <div class="cluster-fabric__api">
                                        <span>OpenAI-compatible API</span>
                                        <code x-text="clusterPublicEndpoint()"></code>
                                    </div>
                                    <div class="cluster-fabric__actions">
                                        <button type="button"
                                                @click="copyClusterCommands(
                                                    'liveEndpoint',
                                                    [
                                                        'Base URL: ' + clusterPublicEndpoint(),
                                                        'Model: ' + clusterLiveModelId()
                                                    ]
                                                )"
                                                class="cluster-fabric__copy"
                                                :title="'Copy endpoint and model ID'">
                                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                            <span x-text="clusterCommandsCopied.liveEndpoint
                                                ? 'Copied'
                                                : 'Copy API details'"></span>
                                        </button>
                                        <button type="button"
                                                @click="runClusterPrimaryAction()"
                                                :disabled="clusterPrimaryActionDisabled()"
                                                class="cluster-fabric__stop"
                                                data-cluster-live-stop>
                                            <i data-lucide="square" class="w-3.5 h-3.5"></i>
                                            <span x-text="clusterPrimaryActionLabel()"></span>
                                        </button>
                                    </div>
                                </div>

                                <div class="cluster-fabric__stage"
                                     role="img"
                                     :aria-label="clusterNeuralFabricAriaLabel()">
                                    <svg class="cluster-fabric__links"
                                         viewBox="0 0 100 100"
                                         preserveAspectRatio="none"
                                         aria-hidden="true">
                                        <defs>
                                            <filter id="cluster-fabric-glow"
                                                    x="-50%" y="-50%" width="200%" height="200%">
                                                <feGaussianBlur stdDeviation="1.25"
                                                                result="coloredBlur"></feGaussianBlur>
                                                <feMerge>
                                                    <feMergeNode in="coloredBlur"></feMergeNode>
                                                    <feMergeNode in="SourceGraphic"></feMergeNode>
                                                </feMerge>
                                            </filter>
                                        </defs>
                                        <path :d="clusterNeuralFabricRingPath()"
                                              class="cluster-fabric__link-base"></path>
                                        <path :d="clusterNeuralFabricRingPath()"
                                              class="cluster-fabric__link-signal"></path>
                                    </svg>

                                    <div class="cluster-fabric__core" aria-hidden="true">
                                        <span class="cluster-fabric__core-ring"></span>
                                        <span class="cluster-fabric__core-ring cluster-fabric__core-ring--inner"></span>
                                        <span class="cluster-fabric__core-neuron">
                                            <i data-lucide="sparkles" class="w-4 h-4"></i>
                                        </span>
                                    </div>

                                    <template x-for="node in clusterNeuralFabricNodes()"
                                              :key="'fabric-' + node.rank">
                                        <div class="cluster-fabric-node"
                                            :class="{
                                                'cluster-fabric-node--local': node.local,
                                                'cluster-fabric-node--online': node.online,
                                                'cluster-fabric-node--working': node.working,
                                                'cluster-fabric-node--cuda': node.accelerator === 'cuda',
                                                'cluster-fabric-node--supernode': node.memberCount > 1
                                            }"
                                             :style="'left:' + node.x + '%;top:' + node.y + '%'">
                                            <div class="cluster-fabric-node__topline">
                                                <span x-text="clusterNodeRankLabel(node)"></span>
                                                <span class="cluster-fabric-node__state"
                                                      x-text="node.state"></span>
                                            </div>
                                            <div class="cluster-fabric-node__identity">
                                                <span class="cluster-fabric-node__orb">
                                                    <template x-if="node.accelerator === 'cuda'">
                                                        <svg role="img" viewBox="0 0 24 24"
                                                             aria-label="NVIDIA CUDA">
                                                            <title>NVIDIA CUDA</title>
                                                            <path fill="currentColor" d="M8.948 8.798v-1.43a6.7 6.7 0 0 1 .424-.018c3.922-.124 6.493 3.374 6.493 3.374s-2.774 3.851-5.75 3.851c-.398 0-.787-.062-1.158-.185v-4.346c1.528.185 1.837.857 2.747 2.385l2.04-1.714s-1.492-1.952-4-1.952a6.016 6.016 0 0 0-.796.035m0-4.735v2.138l.424-.027c5.45-.185 9.01 4.47 9.01 4.47s-4.08 4.964-8.33 4.964c-.37 0-.733-.035-1.095-.097v1.325c.3.035.61.062.91.062 3.957 0 6.82-2.023 9.593-4.408.459.371 2.34 1.263 2.73 1.652-2.633 2.208-8.772 3.984-12.253 3.984-.335 0-.653-.018-.971-.053v1.864H24V4.063zm0 10.326v1.131c-3.657-.654-4.673-4.46-4.673-4.46s1.758-1.944 4.673-2.262v1.237H8.94c-1.528-.186-2.73 1.245-2.73 1.245s.68 2.412 2.739 3.11M2.456 10.9s2.164-3.197 6.5-3.533V6.201C4.153 6.59 0 10.653 0 10.653s2.35 6.802 8.948 7.42v-1.237c-4.84-.6-6.492-5.936-6.492-5.936z"/>
                                                        </svg>
                                                    </template>
                                                    <template x-if="node.accelerator !== 'cuda'">
                                                        <i :data-lucide="node.local ? 'laptop' : 'monitor'"
                                                           class="w-3.5 h-3.5"></i>
                                                    </template>
                                                </span>
                                                <span class="cluster-fabric-node__name"
                                                      x-text="clusterNodeHardwareLabel(node)"></span>
                                            </div>
                                            <div x-show="node.memberCount > 1"
                                                 class="cluster-fabric-node__fabric"
                                                 x-text="node.fabricVerified
                                                    ? `${node.memberCount} physical CUDA workers · ConnectX-7 verified`
                                                    : `${node.memberCount} CUDA workers · direct link not verified`"></div>
                                            <button type="button"
                                                    x-show="node.memberCount > 1 && !node.fabricVerified"
                                                    x-cloak
                                                    @click.stop="verifyCudaSupernode(node)"
                                                    :disabled="!clusterCanVerifyCudaSupernode(node)
                                                        || Boolean(clusterCudaFabricVerificationLoading)"
                                                    class="cluster-fabric-node__verify">
                                                <span x-text="clusterCudaFabricVerificationLoading
                                                    === clusterCudaFabricVerificationKey(node)
                                                    ? 'Testing NCCL…'
                                                    : 'Verify ConnectX'"></span>
                                            </button>
                                            <div x-show="node.fabricVerified && clusterCudaFabricRateLabel(node)"
                                                 x-cloak
                                                 class="cluster-fabric-node__verified-rate"
                                                 x-text="clusterCudaFabricRateLabel(node)"></div>
                                            <div class="cluster-fabric-node__memory"
                                                 x-text="node.memoryLabel"></div>
                                        </div>
                                    </template>
                                </div>

                                <div x-show="clusterCudaFabricVerificationError"
                                     x-cloak
                                     class="cluster-fabric__verification-error"
                                     x-text="clusterCudaFabricVerificationError"></div>

                                <div x-show="!clusterNeuralFabricJob()?.live"
                                     x-cloak
                                     class="cluster-fabric__memory"
                                     data-cluster-memory-allowances>
                                    <div class="cluster-fabric__memory-header">
                                        <div>
                                            <span>Pooled accelerator memory</span>
                                            <strong x-text="clusterCombinedMemoryLabel()"></strong>
                                            <small>Installed memory is shown separately from the safe model budget. Splitting stays automatic unless you override shard balance.</small>
                                        </div>
                                        <button type="button"
                                                x-show="clusterMemoryAllowanceCustomized()"
                                                x-cloak
                                                @click="clusterResetMemoryAllowances()">
                                            Reset to automatic
                                        </button>
                                    </div>
                                    <div class="cluster-fabric__memory-grid">
                                        <template x-for="node in clusterMemoryAllowanceNodes()"
                                                  :key="'memory-allowance-' + node.nodeId">
                                            <label class="cluster-fabric__memory-node">
                                                <span>
                                                    <strong x-text="clusterNodeHardwareLabel(node)"></strong>
                                                    <code x-text="clusterMemoryGiBLabel(node.usableGiB)"></code>
                                                </span>
                                                <input type="range"
                                                       :min="node.minGiB"
                                                       :max="node.capacityGiB"
                                                       step="1"
                                                       :value="node.usableGiB"
                                                       :disabled="clusterPlanLoading
                                                            || clusterAutoconfigureLoading
                                                            || clusterActivationLoading"
                                                       @input="clusterSetMemoryAllowance(
                                                            node, Number($event.target.value)
                                                       )"
                                                       @change="clusterMemoryAllowanceChanged()">
                                            </label>
                                        </template>
                                    </div>
                                </div>

                                <div x-show="clusterNeuralFabricJob()?.live"
                                     x-cloak
                                     class="cluster-fabric__metrics"
                                     aria-label="Live cluster measurements">
                                    <template x-for="metric in clusterNeuralFabricMetrics()"
                                              :key="metric.key">
                                        <div class="cluster-fabric-metric"
                                             :class="'cluster-fabric-metric--' + metric.tone">
                                            <div class="cluster-fabric-metric__label">
                                                <span x-text="metric.label"></span>
                                                <span class="cluster-fabric-metric__indicator"></span>
                                            </div>
                                            <div class="cluster-fabric-metric__value"
                                                 x-text="metric.value"></div>
                                            <div x-show="Number.isFinite(metric.progress)"
                                                 class="cluster-fabric-metric__progress"
                                                 role="progressbar"
                                                 :aria-label="metric.label"
                                                 :aria-valuenow="Math.round(
                                                    Math.max(0, Math.min(1, metric.progress)) * 100
                                                 )"
                                                 aria-valuemin="0"
                                                 aria-valuemax="100">
                                                <span :style="'width:' + (
                                                    Math.max(0, Math.min(1, metric.progress)) * 100
                                                ) + '%'"></span>
                                            </div>
                                            <div class="cluster-fabric-metric__detail"
                                                 x-text="metric.detail"></div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <div x-show="!clusterNeuralFabricJob()?.live"
                             x-cloak
                             class="mt-5 pt-5 border-t border-neutral-200 flex flex-col lg:flex-row lg:items-center gap-4"
                             data-cluster-setup-controls>
                            <div class="flex items-center gap-3 min-w-0 flex-1">
                                <span class="w-11 h-11 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center shrink-0">
                                    <i data-lucide="box" class="w-5 h-5"></i>
                                </span>
                                <div class="min-w-0 flex-1">
                                    <div class="flex items-center gap-2">
                                        <span class="text-[10px] font-bold uppercase tracking-wider text-neutral-400">Model</span>
                                        <template x-if="clusterSelectedModel() && clusterSelectedModelFitLabel()">
                                            <span class="px-2 py-0.5 rounded-full bg-blue-50 text-[9px] font-semibold text-blue-700"
                                                  x-text="clusterSelectedModelFitLabel()"></span>
                                        </template>
                                    </div>
                                    <template x-if="clusterSelectedModel()">
                                        <div>
                                            <div class="text-sm font-semibold text-neutral-900 truncate"
                                                 x-text="clusterModelDisplayName(clusterSelectedModel())"></div>
                                            <div class="text-xs text-neutral-500 mt-0.5">
                                                <span x-text="(clusterSelectedModel().model_type || 'MLX').toUpperCase()"></span>
                                                <span x-show="clusterSelectedModel().estimated_size"
                                                      x-text="' · ' + clusterCatalogueSize(clusterSelectedModel().estimated_size)"></span>
                                                <span x-text="' · ' + clusterModelHostsLabel(clusterSelectedModel())"></span>
                                                <span x-show="clusterModelContextLabel(clusterSelectedModel())"
                                                      x-text="' · ' + clusterModelContextLabel(clusterSelectedModel())"></span>
                                            </div>
                                            <div x-show="clusterCatalogueFit(clusterSelectedModel().model_path)?.fits === false"

                            <div class="rounded-xl border border-blue-200 bg-blue-50 p-4 mb-3">
                                <div class="text-xs font-semibold text-blue-900">Terminal SSH can work while oMLX cannot</div>
                                <p class="text-[10px] text-blue-700 mt-1">
                                    oMLX deliberately uses its own dedicated SSH key. A successful manual SSH login may be using a different key, so complete these steps on both Macs before checking the peer.
                                </p>

                            <div class="rounded-xl border border-amber-200 bg-amber-50 p-4 mb-3">
                                <div class="text-[10px] font-bold uppercase tracking-wider text-amber-800">Step 1 of 3</div>

                                </p>

                                    <input type="password"
                                           x-model.trim="clusterPairingSecret"
                                           minlength="16"
                                           maxlength="256"
                                           autocomplete="new-password"
                                           spellcheck="false"

                                           class="flex-1 text-xs font-mono text-neutral-700 bg-white border border-amber-200 rounded-lg px-3 py-2">
                                    <button type="button"
                                            @click="generateClusterPairingSecret()"
                                            class="px-3 py-2 text-xs font-medium text-amber-900 bg-white border border-amber-200 rounded-lg hover:bg-amber-100">
                                        {{ t('cluster.pairing.generate') }}
                                    </button>
                                    <button type="button"
                                            @click="copyClusterPairingSecret()"
                                            :disabled="clusterPairingSecret.length < 16"
                                            class="px-3 py-2 text-xs font-medium text-amber-900 bg-white border border-amber-200 rounded-lg hover:bg-amber-100 disabled:opacity-50">

                                        <span x-show="clusterPairingSecretCopied" x-cloak>Copied!</span>
                                    </button>
                                </div>
                            </div>
                            <template x-if="clusterSshKey && clusterSshKey.available">
                                <div class="rounded-xl border border-neutral-200 bg-neutral-50 p-4">
                                    <div class="mb-3">
                                        <div class="text-xs font-semibold text-neutral-800">Step 2 of 3 · Confirm the oMLX key is active on both Macs</div>

                                    </div>

                                        <div class="min-w-0">
                                            <div class="flex items-center gap-2">
                                                <span class="px-2 py-0.5 rounded-full bg-green-100 text-green-700 text-[10px] font-semibold">This Mac: Active</span>

                                            <div class="text-[10px] text-amber-700 mt-1">Regenerating disconnects every paired worker. You must exchange keys again on every Mac.</div>
                                        </div>
                                        <button @click="generateClusterSshKey()"

                                                class="px-3 py-1.5 text-xs font-medium text-neutral-700 bg-white border border-neutral-200 rounded-lg hover:bg-neutral-100 disabled:opacity-50">
                                            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>

                                    </div>
                                    <div class="mt-3 pt-3 border-t border-neutral-200">

                                        </p>

                                            <button @click="generateKeyExchangeToken(clusterStatus.node.hostname)"
                                                    :disabled="clusterExchangeTokenLoading || clusterPairingSecret.length < 16"
                                                    class="px-3 py-1.5 text-xs font-medium text-neutral-700 bg-white border border-neutral-200 rounded-lg hover:bg-neutral-100 disabled:opacity-50">
                                                <i data-lucide="key" class="w-3.5 h-3.5"></i>
                                                <span x-text="clusterExchangeTokenLoading ? 'Generating…' : 'Generate exchange token'"></span>

                                        <template x-if="clusterExchangeToken">

                                                    <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                                    <span x-text="clusterExchangeTokenCopied ? 'Copied!' : 'Copy'"></span>
                                                </button>
                                            </div>
                                        </template>
                                        <p class="text-[10px] text-neutral-400 mt-2">Copy this token and paste it into section B on the other Mac.</p>
                                    </div>
                                    <div class="mt-3 pt-3 border-t border-neutral-200">
                                        <div class="text-xs text-neutral-600 mb-2">B · Paste the other Mac's exchange token here</div>
                                        <div class="flex items-start gap-2">
                                            <textarea x-model.trim="clusterPeerExchangeToken"
                                                      rows="2"
                                                      placeholder="Paste the key generated on the other Mac"

                                                      spellcheck="false"

                                            <button @click="exchangeKeysWithPeer(clusterPeerExchangeToken)"
                                                    :disabled="clusterKeyExchangeLoading || !clusterPeerExchangeToken || clusterPairingSecret.length < 16"
                                                    class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-white bg-neutral-900 rounded-lg hover:bg-neutral-800 disabled:opacity-50 whitespace-nowrap">
                                                <i data-lucide="link" class="w-3.5 h-3.5"></i>
                                                <span x-text="clusterKeyExchangeLoading ? 'Pairing…' : 'Pair'"></span>
                                            </button>
                                        </div>
                                        <template x-if="clusterKeyExchangeResult">
                                            <p class="text-[10px] text-green-600 mt-2">This direction is paired. Repeat these steps on the other Mac so both directions are trusted.</p>
                                        </template>
                                    </div>
                                    <div class="mt-3 pt-3 border-t border-neutral-200">
                                        <div class="flex items-center justify-between">
                                            <div>
                                                <div class="text-xs text-neutral-500">macOS Keychain storage</div>
                                                <div class="text-[10px] text-neutral-400 mt-1">Key fingerprint stored securely in system keychain</div>
                                            </div>
                                            <button @click="storeClusterKeyInKeychain()"
                                                    :disabled="clusterKeychainStoring"
                                                    class="px-3 py-1.5 text-xs font-medium text-neutral-700 bg-white border border-neutral-200 rounded-lg hover:bg-neutral-100 disabled:opacity-50">

                                                <span x-text="clusterKeychainStoring ? 'Storing…' : 'Store in Keychain'"></span>

                                    </div>
                                </div>

                            <template x-if="clusterSshKey && !clusterSshKey.available">

                                        <div>
                                            <div class="text-xs font-semibold text-neutral-800">Step 2 of 3 · Generate the oMLX key on this Mac</div>
                                            <div class="text-[10px] text-neutral-500 mt-1">Do this on both Macs. oMLX uses this dedicated key instead of whichever key Terminal chose.</div>
                                        </div>
                                        <button @click="generateClusterSshKey()"

                                            <span x-text="clusterSshKeyGenerating ? 'Generating…' : 'Generate key'"></span>
                                        </button>

                                </div>

                                <label class="block text-xs font-medium text-neutral-600 mb-1.5">Peer SSH name</label>

                                       x-model.trim="clusterPeerSsh"
                                       @input="invalidateClusterPeer(true)"
                                       @keydown.enter="probeClusterPeer()"

                                       spellcheck="false"

                            </div>
                            <!-- Both addresses are read off the live interfaces
                                 of every Mac when the peer is checked. They stay
                                 editable, because someone who knows their fabric
                                 should not be argued with — but an address typed
                                 once and kept is what took a launch down, so it
                                 is never where these start. -->
                            <div>
                                <label class="block text-xs font-medium text-neutral-600 mb-1.5">This Mac · address</label>
                                <input type="text"
                                       x-model.trim="clusterLocalIp"
                                       @input="clusterIpsOverridden = true; invalidateClusterPeer(false)"
                                       :placeholder="clusterFabricLoading ? 'Reading…' : 'Found when you check the peer'"
                                       spellcheck="false"
                                       class="w-full px-3 py-2 text-sm font-mono border border-neutral-200 rounded-xl focus:ring-2 focus:ring-neutral-900 focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-neutral-600 mb-1.5">Peer · address</label>
                                <input type="text"
                                       x-model.trim="clusterPeerIp"
                                       @input="clusterIpsOverridden = true; invalidateClusterPlan()"
                                       :placeholder="clusterFabricLoading ? 'Reading…' : 'Found when you check the peer'"
                                       spellcheck="false"
                                       class="w-full px-3 py-2 text-sm font-mono border border-neutral-200 rounded-xl focus:ring-2 focus:ring-neutral-900 focus:border-transparent">
                            </div>

                                    :disabled="clusterPeerProbeLoading || !clusterPeerSsh.trim()"

                                <i data-lucide="scan-search" class="w-4 h-4"></i>
                                <span x-text="clusterPeerProbeLoading ? 'Checking…' : 'Check peer'"></span>
                            </button>
                        </div>

                        <div class="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1">

                                    :disabled="clusterFabricLoading || !clusterPeerSsh.trim()"

                                <i data-lucide="refresh-cw" class="w-3 h-3"></i>
                                <span x-text="clusterFabricLoading ? 'Reading…' : 'Re-read addresses'"></span>
                            </button>

                                    @click="useDiscoveredClusterAddresses()"

                                <i data-lucide="undo-2" class="w-3 h-3"></i>
                                Use the discovered addresses
                            </button>
                            <span x-show="clusterIpsOverridden" x-cloak class="text-[10px] text-amber-700">

                                <span class="text-[10px]"
                                      :class="clusterFabric.ok ? 'text-neutral-500' : 'text-amber-700'"
