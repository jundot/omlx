<section x-data="usageHistory()" id="usage-history-section" class="bg-white rounded-2xl border border-neutral-200 overflow-hidden" aria-labelledby="usage-heading">
    <div class="flex flex-wrap items-center justify-between gap-2 px-6 py-4 bg-neutral-100 border-b border-neutral-200">
        <div class="flex items-center gap-3">
            <i data-lucide="history" class="w-4 h-4 text-neutral-500"></i>
            <h3 id="usage-heading" class="text-xs font-bold uppercase tracking-wider text-neutral-600">{{ t('usage.heading') }}</h3>
        </div>
        <div class="flex gap-2">
            <select x-model="range" @change="model = ''; load()" aria-label="{{ t('usage.range') }}" class="px-3 py-1.5 text-xs font-medium border border-neutral-200 rounded-lg bg-white focus:ring-2 focus:ring-neutral-900 focus:border-neutral-900 transition-all">
                <option value="today">{{ t('usage.today') }}</option>
                <option value="yesterday">{{ t('usage.yesterday') }}</option>
                <option value="7d">{{ t('usage.7d') }}</option>
                <option value="30d">{{ t('usage.30d') }}</option>
                <option value="90d">{{ t('usage.90d') }}</option>
                <option value="month">{{ t('usage.month') }}</option>
            </select>
            <select x-model="model" @change="load()" aria-label="{{ t('usage.model') }}" class="px-3 py-1.5 text-xs font-medium border border-neutral-200 rounded-lg bg-white focus:ring-2 focus:ring-neutral-900 focus:border-neutral-900 transition-all max-w-48">
                <option value="">{{ t('usage.all_models') }}</option>
                <template x-for="id in models" :key="id"><option :value="id" x-text="id"></option></template>
            </select>
        </div>
    </div>
    <div class="px-6 py-4">
    <p class="text-xs text-neutral-500 mb-4">{{ t('usage.note') }}</p>
    <p x-show="error" x-text="error" role="status" class="text-sm text-amber-700 mb-3"></p>
    <div x-show="disabled" role="status" class="flex flex-wrap items-center gap-3 bg-neutral-50 rounded-xl border border-neutral-200 p-4 mb-3 text-sm text-neutral-600">
        <span>{{ t('usage.disabled') }}</span>
        <button type="button" @click="setSettingsTab('global')" class="font-medium text-neutral-900 underline">{{ t('usage.open_settings') }}</button>
    </div>
    <div x-show="loading && !data && !disabled" class="text-sm text-neutral-500">{{ t('usage.loading') }}</div>
    <template x-if="data">
        <div :aria-busy="loading">
            <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-5">
                <template x-for="[key, label] in [['requests', 'requests'], ['total_tokens', 'total'], ['prompt_tokens', 'prompt'], ['completion_tokens', 'output'], ['cached_tokens', 'cached']]" :key="key">
                    <div class="bg-neutral-50 rounded-xl border border-neutral-200 p-4">
                        <div class="text-xs text-neutral-500" x-text="window.t('usage.' + label)"></div>
                        <div class="text-2xl font-semibold mt-2" x-text="number(data.totals[key])" :title="data.totals[key].toLocaleString()"></div>
                    </div>
                </template>
            </div>
            <p class="text-sm text-neutral-500 mb-3" x-show="data.totals.requests === 0">{{ t('usage.empty') }}</p>
            <div class="border rounded-xl overflow-hidden mb-5">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-right">
                        <thead class="bg-neutral-50 text-xs text-neutral-500">
                            <tr>
                                <th class="p-3 text-left">{{ t('usage.model') }}</th>
                                <th class="p-3">{{ t('usage.requests') }}</th>
                                <th class="p-3">{{ t('usage.prompt') }}</th>
                                <th class="p-3">{{ t('usage.output') }}</th>
                                <th class="p-3">{{ t('usage.cached') }}</th>
                                <th class="p-3">{{ t('usage.total') }}</th>
                                <th class="p-3">{{ t('usage.speed') }}</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="row in data.models" :key="row.model_id">
                                <tr class="border-t">
                                    <th class="p-3 text-left font-medium break-all" x-text="row.model_id"></th>
                                    <template x-for="key in ['requests', 'prompt_tokens', 'completion_tokens', 'cached_tokens', 'total_tokens']" :key="key">
                                        <td class="p-3" x-text="number(row[key])" :title="row[key].toLocaleString()"></td>
                                    </template>
                                    <td class="p-3" x-text="speed(row.generation_tps)"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>
    </div>
</section>
