<section x-data="usageHistory()" class="mb-8 mt-8" aria-labelledby="usage-heading">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h3 id="usage-heading" class="text-xl font-bold">{{ t('usage.heading') }}</h3>
        <div class="flex gap-2">
            <select x-model="range" @change="model = ''; load()" aria-label="{{ t('usage.range') }}" class="border rounded-lg px-3 py-2 text-sm">
                <option value="today">{{ t('usage.today') }}</option>
                <option value="yesterday">{{ t('usage.yesterday') }}</option>
                <option value="7d">{{ t('usage.7d') }}</option>
                <option value="30d">{{ t('usage.30d') }}</option>
                <option value="90d">{{ t('usage.90d') }}</option>
                <option value="month">{{ t('usage.month') }}</option>
            </select>
            <select x-model="model" @change="load()" aria-label="{{ t('usage.model') }}" class="border rounded-lg px-3 py-2 text-sm max-w-48">
                <option value="">{{ t('usage.all_models') }}</option>
                <template x-for="id in models" :key="id"><option :value="id" x-text="id"></option></template>
            </select>
        </div>
    </div>
    <p class="text-xs text-neutral-500 mb-4">{{ t('usage.note') }}</p>
    <p x-show="error" x-text="error" role="status" class="text-sm text-amber-700 mb-3"></p>
    <div x-show="loading && !data" class="text-sm text-neutral-500">{{ t('usage.loading') }}</div>
    <template x-if="data">
        <div :aria-busy="loading">
            <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-5">
                <template x-for="[key, label] in [['requests', 'requests'], ['total_tokens', 'total'], ['prompt_tokens', 'prompt'], ['completion_tokens', 'output'], ['cached_tokens', 'cached']]" :key="key">
                    <div class="bg-neutral-50 rounded-xl border border-neutral-200 p-4">
                        <div class="text-xs text-neutral-500" x-text="window.t('usage.' + label)"></div>
                        <div class="text-2xl font-semibold mt-2" x-text="number(data.totals[key])" :title="data.totals[key].toLocaleString()"></div>
                    </div>
                </template>
            </div>
            <p class="text-sm text-neutral-500 mb-3" x-show="data.totals.requests === 0">{{ t('usage.empty') }}</p>
            <div class="border rounded-xl overflow-hidden mb-5">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-right">
                        <thead class="bg-neutral-50 text-xs text-neutral-500"><tr>
                            <th class="p-3 text-left">{{ t('usage.model') }}</th><th class="p-3">{{ t('usage.requests') }}</th><th class="p-3">{{ t('usage.prompt') }}</th><th class="p-3">{{ t('usage.output') }}</th><th class="p-3">{{ t('usage.cached') }}</th><th class="p-3">{{ t('usage.total') }}</th><th class="p-3">{{ t('usage.speed') }}</th>
                        </tr></thead>
                        <tbody><template x-for="row in data.models" :key="row.model_id"><tr class="border-t">
                            <th class="p-3 text-left font-medium break-all" x-text="row.model_id"></th>
                            <template x-for="key in ['requests', 'prompt_tokens', 'completion_tokens', 'cached_tokens', 'total_tokens']" :key="key"><td class="p-3" x-text="number(row[key])" :title="row[key].toLocaleString()"></td></template>
                            <td class="p-3" x-text="speed(row.generation_tps)"></td>
                        </tr></template></tbody>
                    </table>
                </div>
            </div>
            <div class="border rounded-xl p-4">
                <h4 class="text-sm font-semibold mb-2">{{ t('usage.heatmap') }}</h4>
                <p class="text-xs text-neutral-500 mb-3">{{ t('usage.heatmap_note') }}</p>
                <div class="overflow-auto" style="max-height: 300px">
                    <div style="min-width: 600px">
                        <div style="display:grid;grid-template-columns:90px repeat(24,minmax(0,1fr));gap:3px" class="text-xs text-neutral-500 mb-1">
                            <span></span><template x-for="hour in 24" :key="hour"><span x-text="(hour - 1) % 3 === 0 ? String(hour - 1).padStart(2, '0') : ''"></span></template>
                        </div>
                        <template x-for="day in [...data.heatmap].reverse()" :key="day.date">
                            <div style="display:grid;grid-template-columns:90px repeat(24,minmax(0,1fr));gap:3px" class="mb-1 items-center">
                                <span class="text-xs text-neutral-500" x-text="day.date"></span>
                                <template x-for="(tokens, hour) in day.tokens" :key="hour">
                                    <span role="img" :aria-label="day.date + ' ' + hour + ':00 · ' + tokens.toLocaleString() + ' tokens'" :title="day.date + ' ' + hour + ':00 · ' + tokens.toLocaleString() + ' tokens'" :style="{backgroundColor: shade(tokens), height: '14px', borderRadius: '2px'}"></span>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>
    </template>
</section>
