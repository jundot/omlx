<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9a9da4"/>
      <stop offset="35%"  stop-color="#6e7178"/>
      <stop offset="75%"  stop-color="#3d3f44"/>
      <stop offset="100%" stop-color="#1c1d22"/>
    </linearGradient>
  </defs>
  <!-- Rounded card to match Mac app icon style -->
  <rect x="10" y="10" width="140" height="140" rx="32" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Flyto "ô" glyph: donut + caret roof, source viewBox 240×240, centred in 140×140 inner card.
       Scale 140/240 = 0.5833, offset by (10,10) to land inside the card. -->
  <g transform="translate(10, 10) scale(0.5833)">
    <path fill="url(#silver)" fill-rule="evenodd"
          d="M120,60 a78,78 0 1 0 0.01,0 Z M120,108 a30,30 0 1 1 -0.01,0 Z"/>
    <polygon fill="url(#silver)" points="120,18 216,98 198,114 120,48 42,114 24,98"/>
  </g>
</svg>
