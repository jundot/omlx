name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ds4-support:
    # The pinned DS4 source uses Metal residency/math APIs unavailable in the
    # macOS 14/Xcode 15 SDK on GitHub-hosted runners.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Build pinned DS4 support tree
        run: scripts/build-ds4-support.sh --out "$RUNNER_TEMP/DS4Support"

      - name: Verify DS4 support tree
        run: |
          test -x "$RUNNER_TEMP/DS4Support/ds4-server"
          test -f "$RUNNER_TEMP/DS4Support/metal/flash_attn.metal"
          "$RUNNER_TEMP/DS4Support/ds4-server" --help | grep -- --ssd-streaming

  test:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]"
          python -m pip install pytest pytest-asyncio

      - name: Run unit tests
        run: python -m pytest tests/ -m "not slow and not integration"
